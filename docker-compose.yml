services:
  bot:
    build: .
    env_file: .env
    depends_on:
      - db

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tradingbot
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  timescale_data:
