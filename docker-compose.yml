services:
  bot:
    build: .
    env_file: .env
    environment:
      # Inne i compose-nettverket heter databasen "db", ikke "localhost" –
      # overstyrer eventuell DATABASE_URL fra .env for at bot-containeren
      # faktisk skal nå db-containeren.
      DATABASE_URL: postgresql://user:password@db:5432/tradingbot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tradingbot
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tradingbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  timescale_data:
